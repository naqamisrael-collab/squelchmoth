name: Windows test (the installer we sell)

# Installs dist/Squelchmoth-Windows.zip exactly as a customer would, runs the full self-test on real Windows,
# and takes a screenshot of the app. Results: the run log, and the "windows-test" artifact (log + screenshot).
on:
  push:
    paths: [ "dist/Squelchmoth-Windows.zip", ".github/workflows/windows-test.yml" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install (silent, like the installer's Next > I Agree > Install)
        shell: pwsh
        run: |
          Expand-Archive dist/Squelchmoth-Windows.zip -DestinationPath w
          $setup = Get-ChildItem w -Recurse -Filter "Squelchmoth-Setup-*.exe" | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList "/S"
          Get-ChildItem "C:\Program Files\Squelchmoth"
          if (-not (Test-Path "C:\Program Files\Squelchmoth\Squelchmoth.exe")) { throw "not installed" }
          Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Squelchmoth" | Select-Object DisplayName, DisplayVersion, Publisher

      - name: Self-test (986 checks, driven through Claude's tools)
        shell: pwsh
        run: |
          $p = Start-Process -PassThru -Wait -FilePath "C:\Program Files\Squelchmoth\Squelchmoth.exe" -ArgumentList "--selftest" `
                 -RedirectStandardOutput selftest.log -RedirectStandardError selftest.err
          Select-String -Path selftest.log -Pattern "FAIL" | Select-Object -First 60
          Get-Content selftest.log -Tail 5
          "exit code: $($p.ExitCode)"
          exit $p.ExitCode

      - name: Screenshot of the running app
        if: always()
        shell: pwsh
        run: |
          Start-Process "C:\Program Files\Squelchmoth\Squelchmoth.exe"
          Start-Sleep -Seconds 45
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\screenshot.png")
          Get-Process Squelchmoth | Select-Object Id, Responding, WorkingSet64

      - name: Uninstall
        if: always()
        shell: pwsh
        run: |
          Stop-Process -Name Squelchmoth -ErrorAction SilentlyContinue
          Start-Process -Wait -FilePath "C:\Program Files\Squelchmoth\Uninstall Squelchmoth.exe" -ArgumentList "/S"
          Start-Sleep -Seconds 10
          "still there: $(Test-Path 'C:\Program Files\Squelchmoth\Squelchmoth.exe')"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test
          path: |
            selftest.log
            selftest.err
            screenshot.png
